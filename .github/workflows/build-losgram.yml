name: Build LosGram APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gradle'
      - '**.gradle.kts'
      - 'gradle.properties'
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - '.github/workflows/build-losgram.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore missing AndroidX Media3 and JLatexMath modules
        run: |
          if [ ! -f TMessagesProj_Modules/media/core_settings.gradle ]; then
            rm -rf TMessagesProj_Modules/media
            mkdir -p TMessagesProj_Modules
            git clone --depth 1 --branch telegram-v1.10.1-ffmpeg https://github.com/Arseny271/media.git TMessagesProj_Modules/media
          fi
          test -f TMessagesProj_Modules/media/core_settings.gradle
          if [ ! -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle ]; then
            rm -rf TMessagesProj/lib/jlatexmath
            mkdir -p TMessagesProj/lib
            git clone --depth 1 --branch android https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          fi
          test -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle
          if [ ! -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle ]; then
            rm -rf TMessagesProj/lib/jlatexmath
            mkdir -p TMessagesProj/lib
            git clone --depth 1 --branch android https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          fi
          test -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle
          if [ ! -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle ]; then
            rm -rf TMessagesProj/lib/jlatexmath
            mkdir -p TMessagesProj/lib
            git clone --depth 1 --branch android https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          fi
          test -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Configure Telegram API credentials
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          if [ -z "$TELEGRAM_APP_ID" ] || [ -z "$TELEGRAM_APP_HASH" ]; then
            echo "::error::Add TELEGRAM_APP_ID and TELEGRAM_APP_HASH in repository Actions secrets."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          text = path.read_text()
          text = text.replace("public static int APP_ID = 0;", "public static int APP_ID = " + os.environ["TELEGRAM_APP_ID"] + ";")
          text = text.replace('public static String APP_HASH = "";', 'public static String APP_HASH = "' + os.environ["TELEGRAM_APP_HASH"] + '";')
          path.write_text(text)
          PY

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LosGram-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
