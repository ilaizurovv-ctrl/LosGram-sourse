name: LosGram Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'gradle.properties'
      - '.github/workflows/losgram-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore missing AndroidX Media3 and JLatexMath modules
        run: |
          if [ ! -f TMessagesProj_Modules/media/core_settings.gradle ]; then
            rm -rf TMessagesProj_Modules/media
            mkdir -p TMessagesProj_Modules
            git clone --depth 1 --branch telegram-v1.10.1-ffmpeg https://github.com/Arseny271/media.git TMessagesProj_Modules/media
          fi
          test -f TMessagesProj_Modules/media/core_settings.gradle
          if [ ! -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle ]; then
            rm -rf TMessagesProj/lib/jlatexmath
            mkdir -p TMessagesProj/lib
            git clone --depth 1 --branch android https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          fi
          test -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle
          if [ ! -f TMessagesProj/jni/third_party/libyuv/CMakeLists.txt ]; then
            rm -rf TMessagesProj/jni/third_party/libyuv
            git clone --depth 1 https://chromium.googlesource.com/libyuv/libyuv TMessagesProj/jni/third_party/libyuv
          fi
          test -f TMessagesProj/jni/third_party/libyuv/CMakeLists.txt
          if [ ! -f TMessagesProj/jni/third_party/absl/CMakeLists.txt ]; then
            rm -rf TMessagesProj/jni/third_party/absl
            git clone --depth 1 --branch master https://github.com/abseil/abseil-cpp.git TMessagesProj/jni/third_party/absl
          fi
          test -f TMessagesProj/jni/third_party/absl/CMakeLists.txt
          # This WebRTC snapshot uses the historical absl::Nonnull<T> spelling.
          # Upstream Abseil exposes nullability as pointer annotations instead.
          if ! grep -q 'using Nonnull =' TMessagesProj/jni/third_party/absl/absl/base/nullability.h; then
            sed -i '/#endif  \/\/ ABSL_BASE_NULLABILITY_H_/i namespace absl { template <typename T> using Nonnull = T; template <typename T> using Nullable = T; }' TMessagesProj/jni/third_party/absl/absl/base/nullability.h
          fi
          grep -q 'using Nonnull =' TMessagesProj/jni/third_party/absl/absl/base/nullability.h
          # The FFmpeg submodule may be absent in the source snapshot; restore the
          # version expected by the Telegram Media3 integration.
          if [ ! -f TMessagesProj/jni/third_party/ffmpeg/libavutil/timestamp.h ]; then
            rm -rf TMessagesProj/jni/third_party/ffmpeg
            git clone --depth 1 --branch n7.1.1 https://github.com/FFmpeg/FFmpeg.git TMessagesProj/jni/third_party/ffmpeg
          fi
          test -f TMessagesProj/jni/third_party/ffmpeg/libavutil/timestamp.h
          if [ ! -f TMessagesProj/jni/third_party/boringssl/include/openssl/aes.h ] || [ ! -f TMessagesProj/jni/third_party/boringssl/include/openssl/rand.h ]; then
            rm -rf TMessagesProj/jni/third_party/boringssl
            git clone --depth 1 https://github.com/google/boringssl.git TMessagesProj/jni/third_party/boringssl
          fi
          test -f TMessagesProj/jni/third_party/boringssl/include/openssl/aes.h
          test -f TMessagesProj/jni/third_party/boringssl/include/openssl/rand.h
          if [ ! -f TMessagesProj/jni/tgcalls/tgcalls/AudioDeviceHelper.cpp ] || [ ! -f TMessagesProj/jni/tgcalls/tgcalls/platform/android/AndroidInterface.cpp ] || [ ! -f TMessagesProj/jni/tgcalls/tgcalls/group/AudioStreamingPart.cpp ]; then
            rm -rf TMessagesProj/jni/tgcalls
            git clone https://github.com/TelegramMessenger/tgcalls.git TMessagesProj/jni/tgcalls
            git -C TMessagesProj/jni/tgcalls checkout 545f5ae599f8282e1ae3f38aaff166d179d75703
          fi
          test -f TMessagesProj/jni/tgcalls/tgcalls/AudioDeviceHelper.cpp
          test -f TMessagesProj/jni/tgcalls/tgcalls/platform/android/AndroidInterface.cpp
          test -f TMessagesProj/jni/tgcalls/tgcalls/group/AudioStreamingPart.cpp
          # Keep this tgcalls snapshot compatible with the older WebRTC API embedded in this source tree.
          sed -i 's/OnUnDemuxableRtpPacket(const webrtc::RtpPacketReceived &packet) override/OnUnDemuxableRtpPacket(const webrtc::RtpPacketReceived \&packet)/' TMessagesProj/jni/tgcalls/tgcalls/group/GroupInstanceReferenceImpl.cpp
          sed -i '/config.disable_payload_type_demuxing = true;/d' TMessagesProj/jni/tgcalls/tgcalls/group/GroupInstanceReferenceImpl.cpp
          ! grep -q 'disable_payload_type_demuxing' TMessagesProj/jni/tgcalls/tgcalls/group/GroupInstanceReferenceImpl.cpp
          test -f TMessagesProj/jni/tgcalls/tgcalls/ChannelManager.cpp
          # The Android tgcalls revision renamed the old ICE transport implementation to DTLS.
          sed -i 's/MtProtoIceTransport.cpp/MtProtoDtlsTransport.cpp/g; s/MtProtoIceTransportTest.cpp/MtProtoDtlsTransportTest.cpp/g' TMessagesProj/jni/voip/CMakeLists.txt
          test -f TMessagesProj/jni/tgcalls/tgcalls/v2/MtProtoDtlsTransport.cpp
          if [ ! -f TMessagesProj/jni/third_party/xiph/ogg/src/bitwise.c ]; then
            rm -rf TMessagesProj/jni/third_party/xiph/ogg
            mkdir -p TMessagesProj/jni/third_party/xiph
            git clone --depth 1 https://github.com/xiph/ogg.git TMessagesProj/jni/third_party/xiph/ogg
          fi
          test -f TMessagesProj/jni/third_party/xiph/ogg/src/bitwise.c
          if [ ! -f TMessagesProj/jni/third_party/xiph/opusfile/src/info.c ]; then
            rm -rf TMessagesProj/jni/third_party/xiph/opusfile
            mkdir -p TMessagesProj/jni/third_party/xiph
            git clone --depth 1 https://github.com/xiph/opusfile.git TMessagesProj/jni/third_party/xiph/opusfile
          fi
          test -f TMessagesProj/jni/third_party/xiph/opusfile/src/info.c

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Configure Telegram API credentials
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          if [ -z "$TELEGRAM_APP_ID" ] || [ -z "$TELEGRAM_APP_HASH" ]; then
            echo "::error::Add TELEGRAM_APP_ID and TELEGRAM_APP_HASH in repository Actions secrets."
            exit 1
          fi
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          s = p.read_text()
          import re
          s = re.sub(r'public static int APP_ID = [0-9]+;', 'public static int APP_ID = ' + os.environ["TELEGRAM_APP_ID"] + ';', s)
          s = re.sub(r'public static String APP_HASH = "[^"]*";', 'public static String APP_HASH = "' + os.environ["TELEGRAM_APP_HASH"] + '";', s)
          p.write_text(s)
          PY

      - name: Configure Firebase placeholder when no project config is supplied
        run: |
          if [ ! -f TMessagesProj/google-services.json ]; then
            printf '%s\n' '{"project_info":{"project_number":"000000000000","project_id":"losgram-build-placeholder","storage_bucket":"losgram-build-placeholder.appspot.com"},"client":[],"configuration_version":"1"}' > TMessagesProj/google-services.json
          fi

      - name: Build universal debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LosGram-debug-APK
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 14
